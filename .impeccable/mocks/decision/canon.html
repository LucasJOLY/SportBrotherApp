<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F2F2F7;color:#000;font:17px/1.3 -apple-system,system-ui,sans-serif}
.status{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-weight:600;font-size:15px}
h1{font-weight:700;font-size:34px;padding:6px 20px 12px}
.sec{font-size:13px;color:#6D6D72;text-transform:uppercase;padding:14px 36px 6px}
.grp{margin:0 16px;background:#fff;border-radius:12px;overflow:hidden}
.cell{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:.5px solid #D1D1D6;margin-left:0}
.cell:last-child{border-bottom:0}
.cell small{color:#8E8E93;font-size:15px}
.chk{color:#FF9500}
.btn{margin:16px;height:50px;border-radius:25px;background:#FF9500;color:#fff;font-weight:600;display:grid;place-items:center}
.tabbar{position:absolute;left:16px;right:16px;bottom:26px;height:62px;border-radius:31px;background:rgba(255,255,255,.7);box-shadow:0 6px 24px rgba(0,0,0,.12);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center;font-size:10px;font-weight:600;color:#8E8E93}
.tabbar .on{color:#FF9500}
.tabbar i{display:block;font-style:normal;font-size:20px}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<h1>Semaine</h1>
<div class="sec">Mardi 28 octobre</div>
<div class="grp"><div class="cell"><span>Midi · Reste de bœuf</span><span class="chk">✓</span></div><div class="cell"><span>Soir · Poulet citron</span><small>35 min</small></div></div>
<div class="btn">Commencer la recette</div>
<div class="sec">Mercredi 29 octobre</div>
<div class="grp"><div class="cell"><span>Midi</span><small>Restaurant</small></div><div class="cell"><span>Soir · Curry de pois chiches</span><small>30 min</small></div></div>
<div class="sec">Jeudi 30 octobre</div>
<div class="grp"><div class="cell"><span>Midi · Reste de curry</span><small></small></div><div class="cell"><span>Soir · Dinde, quinoa</span><small>25 min</small></div></div>
<div class="tabbar"><span class="on"><i>▦</i>Semaine</span><span><i>☰</i>Recettes</span><span><i>✓</i>Courses</span><span><i>⚙</i>Réglages</span></div>
</body></html>
