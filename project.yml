name: SportBrother
options:
  bundleIdPrefix: com.lucasjoly
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.30.0"

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

targets:
  SportBrother:
    type: application
    platform: iOS
    sources:
      - path: SportBrother
        excludes:
          - "Resources/ExerciseCatalog/**"
      - path: SportBrother/Resources/ExerciseCatalog
        type: folder
        buildPhase: resources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasjoly.SportBrother
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SportBrother/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SportBrother
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Pour prendre en photo tes plats et les machines de la salle."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    dependencies:
      - target: SportBrotherWidgets
      - package: Supabase

  SportBrotherWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SportBrotherWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasjoly.SportBrother.Widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SportBrother
    info:
      path: SportBrotherWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SportBrotherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SportBrotherTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasjoly.SportBrotherTests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SportBrother.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SportBrother"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SportBrother

  SportBrotherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SportBrotherUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasjoly.SportBrotherUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SportBrother
    dependencies:
      - target: SportBrother

schemes:
  SportBrother:
    build:
      targets:
        SportBrother: all
        SportBrotherTests: [test]
        SportBrotherUITests: [test]
    test:
      targets:
        - SportBrotherTests
        - SportBrotherUITests
