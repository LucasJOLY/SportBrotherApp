name: RepasJOLY
options:
  bundleIdPrefix: com.lucasjoly
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

targets:
  RepasJOLY:
    type: application
    platform: iOS
    sources:
      - RepasJOLY
      - Shared
    resources: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasjoly.RepasJOLY
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RepasJOLY/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: RepasJOLY
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Pour prendre en photo tes plats."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    dependencies:
      - target: RepasJOLYWidgets

  RepasJOLYWidgets:
    type: app-extension
    platform: iOS
    sources:
      - RepasJOLYWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasjoly.RepasJOLY.Widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RepasJOLY
    info:
      path: RepasJOLYWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  RepasJOLYTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RepasJOLYTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasjoly.RepasJOLYTests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RepasJOLY.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RepasJOLY"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: RepasJOLY

schemes:
  RepasJOLY:
    build:
      targets:
        RepasJOLY: all
        RepasJOLYTests: [test]
    test:
      targets:
        - RepasJOLYTests
